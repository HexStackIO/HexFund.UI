name: Android Build & Firebase Distribution

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build APK & Distribute to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache .NET workload packs
        id: cache-workloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/metadata
            ${{ env.DOTNET_ROOT }}/library-packs
          key: dotnet-workloads-${{ runner.os }}-${{ hashFiles('**/global.json') }}-maui-android-v1
          restore-keys: |
            dotnet-workloads-${{ runner.os }}-

      - name: Install MAUI Android workload
        if: steps.cache-workloads.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android android --skip-sign-check

      - name: Create AuthSecrets
        run: |
          cat > Config/AuthSecrets.cs << 'EOF'
          namespace HexFund.UI.Config;
          internal static class AuthSecrets
          {
              public const string ClientId    = "${{ secrets.HEXFUND_CLIENT_ID }}";
              public const string TenantId    = "${{ secrets.HEXFUND_TENANT_ID }}";
              public const string ApiClientId = "${{ secrets.HEXFUND_API_CLIENT_ID }}";
          }
          EOF

      - name: Restore NuGet packages
        run: dotnet restore HexFund.UI.csproj -p:TargetFrameworks=net9.0-android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/hexfund.keystore"

      - name: Build signed APK
        run: |
          dotnet publish HexFund.UI.csproj \
            -f net9.0-android \
            -c Release \
            -p:TargetFrameworks=net9.0-android \
            -p:AndroidSigningKeyStore="${{ github.workspace }}/hexfund.keystore" \
            -p:AndroidSigningStorePass="${{ secrets.KEYSTORE_PASSWORD }}" \
            -p:AndroidSigningKeyAlias="${{ secrets.KEY_ALIAS }}" \
            -p:AndroidSigningKeyPass="${{ secrets.KEY_PASSWORD }}" \
            -p:AndroidPackageFormat=apk \
            -o "${{ github.workspace }}/output"

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find "${{ github.workspace }}/output" -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexFund-${{ github.run_number }}.apk
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 14

      - name: Cache Firebase CLI
        id: cache-firebase
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: firebase-tools-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            firebase-tools-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: steps.cache-firebase.outputs.cache-hit != 'true'
        run: npm install -g firebase-tools

      # NOTE: FIREBASE_TOKEN is deprecated — migrate to a service account key:
      # 1. Create a service account in GCP with "Firebase App Distribution Admin" role
      # 2. Download the JSON key
      # 3. Store it as GOOGLE_APPLICATION_CREDENTIALS_JSON secret
      # 4. Replace the env block below with:
      #    GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - name: Upload to Firebase App Distribution
        run: |
          firebase appdistribution:distribute "${{ steps.find_apk.outputs.APK_PATH }}" \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "beta-testers" \
            --release-notes "Build ${{ github.run_number }} from commit ${{ github.sha }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}